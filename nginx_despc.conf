# /etc/nginx/sites-available/despc
# Configuración independiente para DESPC (Evaluaciones PENSIV)

server {
    listen 8082;
    server_name _;

    client_max_body_size 50M;

    # 1. Frontend React (Archivos Estáticos SPA)
    root /var/www/despc/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy Inverso para el Backend FastAPI (Puerto 3006)
    location /api/ {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Logs dedicados para DESPC
    access_log /var/log/nginx/despc_access.log;
    error_log /var/log/nginx/despc_error.log;
}
