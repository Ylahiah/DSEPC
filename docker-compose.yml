version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: dsepc_backend
    restart: unless-stopped
    volumes:
      # Map the data directory so the SQLite DB persists across restarts
      - ./data:/app/data
      # Map the storage directory for Excel files
      - ./storage:/app/storage
    environment:
      # Override config to put the DB in the persistent volume
      - DATABASE_URL=sqlite:////app/data/dsepc.db
      - FRONTEND_ORIGIN=http://localhost
      # If you set up a domain later (e.g. dsepc.miempresa.com), add it to FRONTEND_ORIGIN:
      # - FRONTEND_ORIGIN=https://dsepc.miempresa.com
    # Port 8000 is internal; Nginx will proxy to it. No need to expose it directly to the host.
    expose:
      - 8000

  frontend:
    build:
      context: ./frontend
      args:
        # Nginx will serve frontend on port 80 and proxy /api/v1 to backend:8000
        - VITE_API_BASE_URL=/api/v1
    container_name: dsepc_frontend
    restart: unless-stopped
    ports:
      # Map port 80 on the host to port 80 on the Nginx container
      - "80:80"
    depends_on:
      - backend
