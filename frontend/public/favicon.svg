<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="dsepc-grad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="check-grad" x1="10" y1="10" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Shield with Smooth Rounded Corners -->
  <path
    d="M16 2.5C21.5 5 27 5.5 28 6.5C28.5 13.5 27 22.5 16 29.5C5 22.5 3.5 13.5 4 6.5C5 5.5 10.5 5 16 2.5Z"
    fill="url(#dsepc-grad)"
  />

  <!-- Subtle Inner Border -->
  <path
    d="M16 4C20.5 6.2 25 6.6 26 7.4C26.4 13.2 25.1 20.8 16 27C6.9 20.8 5.6 13.2 6 7.4C7 6.6 11.5 6.2 16 4Z"
    stroke="rgba(255, 255, 255, 0.25)"
    stroke-width="0.75"
    fill="none"
  />

  <!-- Elegant Checkmark -->
  <path
    d="M10.5 15.5L14.2 19.2L21.5 11.8"
    stroke="url(#check-grad)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#shadow)"
  />
</svg>